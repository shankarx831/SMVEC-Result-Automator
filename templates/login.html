<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SMVEC Result Automator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f5f5f4;
            color: #1c1917;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1c1917;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #78716c;
        }

        .card {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.8125rem;
            color: #44403c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .text-input {
            width: 100%;
            background: #fafaf9;
            border: 1.5px solid #e7e5e4;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.875rem;
            color: #1c1917;
            transition: border-color 0.15s;
        }

        .text-input:focus {
            outline: none;
            border-color: #a8a29e;
        }

        .btn-submit {
            width: 100%;
            background: #16a34a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #15803d;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.8125rem;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-header">
            <h1>Sign in</h1>
            <p>Access SMVEC Result Automator portal</p>
        </div>

        <div class="card">
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="text-input" placeholder="Enter username" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="text-input" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; font-size: 0.75rem; color: #78716c;">
                If you want access or forgot your password,<br>contact <strong>Sankara Narayanan.R (IT A 2025-2029)</strong>
                <div style="margin-top: 16px;">
                    <a href="https://github.com/shankarx831/SMVEC-Result-Automator" target="_blank" style="color: #0ea5e9; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                        View on GitHub
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
